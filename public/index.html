<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#FFFFFF">
  <title>여성문화센터 대관 예약</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/tokens.css">
</head>
<body>
  <header class="top"><div class="top-in">
      <div class="top-row">
        <button type="button" class="back" id="back" aria-label="이전 단계" hidden>&lsaquo;</button>
        <img class="wordmark" src="/logo.svg" alt="여성문화센터" width="150" height="26"><span class="brand">대관 예약</span>
        <span class="tools"><a class="hotline" id="hotline" hidden></a><button type="button" class="myres" id="whereBtn">오시는 길</button><button type="button" class="myres" id="myres">내 예약</button></span>
      </div>
      <div class="progress" role="progressbar" aria-label="예약 진행" aria-valuemin="1" aria-valuemax="6" id="prog"><i id="progBar"></i></div>
      <ol class="stepnav" id="stepnav" aria-label="진행 단계"></ol>
    </div></header>

  <div class="app">
    <div class="col">

    <div class="notice error" id="storeNotice" hidden>예약 저장소가 아직 설정되지 않아 예약할 수 없습니다. 관리자에게 알려 주세요.</div>
    <div class="notice" id="lastNotice" hidden><span id="lastText"></span><button type="button" id="lastBtn">입금 안내 보기</button></div>
    <div class="notice error" id="netNotice" hidden><span>예약 현황을 불러오지 못했습니다.</span><button type="button" id="retryBtn">다시 불러오기</button></div>

    <main id="main" aria-live="polite"></main>

    <div class="dock" id="dock">
      <div class="peek" id="peek" hidden></div>
      <button type="button" class="btn" id="next" disabled>다음</button>
      <p class="cta-hint" id="ctaHint"></p>
    </div>

    </div>

    <aside class="side" id="side" aria-label="예약 요약"></aside>
  </div>

  <dialog id="whereDlg" aria-label="오시는 길"><div id="where"></div></dialog>

  <script type="module" src="/app.js"></script>
</body>
</html>
