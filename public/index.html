<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7F4EC">
  <title>여성문화센터 대관 예약</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234F6F52'/%3E%3Cpath d='M9 24V15a7 7 0 0114 0v9' fill='none' stroke='%23F7F4EC' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='19' r='1.6' fill='%23F2C9A0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <div class="col">
    <header class="top">
      <div class="top-row">
        <button type="button" class="back" id="back" aria-label="이전 단계" hidden>&lsaquo;</button>
        <span class="brand">여성문화센터 대관 예약</span>
      </div>
      <div class="progress" role="progressbar" aria-label="예약 진행" aria-valuemin="1" aria-valuemax="6" id="prog"><i id="progBar"></i></div>
    </header>

    <div class="notice error" id="storeNotice" hidden>예약 저장소가 아직 설정되지 않아 예약할 수 없습니다. 관리자에게 알려 주세요.</div>
    <div class="notice" id="lastNotice" hidden><span id="lastText"></span><button type="button" id="lastBtn">입금 안내 보기</button></div>
    <div class="notice error" id="netNotice" hidden><span>예약 현황을 불러오지 못했습니다.</span><button type="button" id="retryBtn">다시 불러오기</button></div>

    <main id="main" aria-live="polite"></main>

    <div class="dock" id="dock">
      <div class="peek" id="peek" hidden></div>
      <button type="button" class="btn" id="next" disabled>다음</button>
      <p class="cta-hint" id="ctaHint"></p>
    </div>

    <footer class="foot" id="foot"></footer>
    </div>

    <aside class="side" id="side" aria-label="예약 요약"></aside>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
