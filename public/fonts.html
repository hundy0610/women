<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>글꼴과 로고 고르기</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/fonts.css">
</head>
<body>
  <main>
    <h1 class="pg">글꼴과 로고 고르기</h1>
    <p class="lead">같은 화면 조각을 글꼴만 바꿔서 나란히 놓았습니다. 마음에 드는 번호를 알려 주세요. "사이트에서 보기"를 누르면 실제 예약 화면이 그 글꼴로 열립니다.</p>

    <section class="grid" id="fonts"></section>

    <h2 class="sec">로고 (색 없이 글자만)</h2>
    <p class="lead">세 가지 모양입니다. 글꼴은 Pretendard로 만들었고, 선택하시면 다른 글꼴로도 만들 수 있습니다.</p>
    <section class="logos">
      <figure><img src="/logo-a.svg" alt="로고 A" height="40"><figcaption><b>A.</b> 중간 굵기, 글자 간격을 넓게</figcaption></figure>
      <figure><img src="/logo-b.svg" alt="로고 B" height="64"><figcaption><b>B.</b> 두 줄로 쌓기</figcaption></figure>
      <figure><img src="/logo-c.svg" alt="로고 C" height="40"><figcaption><b>C.</b> 얇은 굵기, 우아하게</figcaption></figure>
    </section>
  </main>
  <script src="/fonts.js"></script>
</body>
</html>
