<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F8FAF5">
  <title>한빛커뮤니티 관리</title>
  <link rel="icon" type="image/svg+xml" href="/icon-hanbit.svg">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/fonts/pretendard/pretendard.css">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/crew.css">
  <link rel="stylesheet" href="/hanbit.css">
</head>
<body class="adm hanbit">
  <section class="login" id="loginView">
    <form class="card" id="login">
      <a class="logo" href="/hanbit-admin" aria-label="한빛커뮤니티 관리"><span class="t"><b>한빛</b> <span>커뮤니티</span><i></i></span><small>관리</small></a>
      <div><h1 style="font-size:28px">소모임 신청 관리</h1><p class="lead" style="margin-bottom:0">관리자 비밀번호를 입력하세요.</p></div>
      <div class="field"><label for="pw">비밀번호</label><input class="input" id="pw" type="password" autocomplete="current-password" required><div id="loginErr" role="alert" aria-live="polite"></div></div>
      <button class="btn primary block" type="submit" id="loginBtn">들어가기</button>
    </form>
  </section>

  <div id="appView" hidden>
    <div class="mhd" style="display:block">
      <div class="hd-in">
        <a class="logo" href="/hanbit-admin" aria-label="한빛커뮤니티 관리"><span class="t"><b>한빛</b> <span>커뮤니티</span><i></i></span><small>관리</small></a>
        <nav class="nav"><a href="/hanbit">신청 화면 보기</a><button type="button" id="logout"></button></nav>
      </div>
    </div>
    <main class="main" style="margin-inline:auto">
      <div class="row-f sp-b wrapf" style="gap:12px">
        <div><p class="dateline" id="aDate"></p><h1>소모임 신청 관리</h1></div>
        <div class="row-f wrapf"><button type="button" class="btn secondary s" id="csvBtn"></button><button type="button" class="btn secondary s" id="reloadBtn"></button></div>
      </div>
      <div class="kinds" id="view" role="group" aria-label="보기">
        <button type="button" class="kbtn" data-v="list" aria-pressed="true">신청 목록</button>
        <button type="button" class="kbtn" data-v="log" aria-pressed="false">이력</button>
        <button type="button" class="kbtn" data-v="new" aria-pressed="false">직접 등록</button>
      </div>

      <section id="v-list" class="stack">
        <div class="stats" id="stats"></div>
        <details class="card"><summary class="b" style="cursor:pointer;min-height:44px;display:flex;align-items:center">시간대별 정원 보기 (신청이 있는 시간대는 노란색)</summary><div class="chips" id="seats" style="margin-top:12px"></div></details>
        <div class="chips" id="filters" role="group" aria-label="상태 필터"></div>
        <div class="field search"><input class="input" id="q" type="search" placeholder="이름, 전화번호, 신청번호 검색" aria-label="검색"><span class="si" aria-hidden="true"></span></div>
        <div class="stack" id="rows"></div>
      </section>

      <section id="v-log" class="stack" hidden>
        <div class="card"><h2>변경 이력</h2><p class="muted sm" style="margin:6px 0 10px">신청, 입금 확인, 연장, 취소, 문자 발송 결과가 시간순으로 남습니다.</p><div class="tl" id="logList"></div></div>
      </section>

      <section id="v-new" class="stack" hidden>
        <div class="alert a-info"><span class="ai"></span><span>전화·방문 접수용이에요. 확정으로 등록하면 입력한 번호로 확정 문자가 바로 가요.</span></div>
        <div id="newBox" class="stack"></div>
      </section>
    </main>
    <dialog id="adlg" class="sheet" aria-labelledby="adlgT"><div class="scrim"><div class="dlg" id="adlgBox"></div></div></dialog>
    <div class="toast t-ok" id="toast" role="status" hidden></div>
  </div>
  <script type="module" src="/hanbit-admin.js"></script>
</body>
</html>
