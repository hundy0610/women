<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>로고 고르기</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/tokens.css">
<style>body{margin:0;font-family:var(--font);color:var(--primary);line-height:1.6}main{max-width:900px;margin:0 auto;padding:32px 20px}h1{font-size:1.6rem;margin:0 0 8px}p{color:var(--secondary);margin:0 0 24px}
.logos{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:28px 32px;display:grid;gap:14px;justify-items:start}figcaption{font-size:.9rem;color:var(--secondary)}</style></head>
<body><main><h1>로고 고르기</h1><p>글자만 쓴 세 가지 모양입니다(A 적용 중). 마음에 드는 알파벳을 알려 주세요.</p>
<section class="logos"><figure><img src="/logo-a.svg" alt="로고 A" height="40"><figcaption><b>A.</b> 굵기 대비(여성 굵게, 문화센터 가볍게)</figcaption></figure>
<figure><img src="/logo-b.svg" alt="로고 B" height="48"><figcaption><b>B.</b> 한글 아래 영문 작은 글씨</figcaption></figure>
<figure><img src="/logo-c.svg" alt="로고 C" height="40"><figcaption><b>C.</b> 넓은 자간 + 노란 막대</figcaption></figure></section></main></body></html>
