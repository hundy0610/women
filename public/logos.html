<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>로고 고르기</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css"><link rel="stylesheet" href="/tokens.css">
<style>body{margin:0;font-family:var(--font);color:var(--primary);line-height:1.6}main{max-width:900px;margin:0 auto;padding:32px 20px}h1{font-size:1.6rem;margin:0 0 8px}p{color:var(--secondary);margin:0 0 24px}
.logos{display:flex;flex-wrap:wrap;gap:20px}figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:28px 32px;display:grid;gap:14px;justify-items:start}figcaption{font-size:.9rem;color:var(--secondary)}</style></head>
<body><main><h1>로고 고르기</h1><p>색 없이 글자만 쓴 세 가지 모양입니다(나눔스퀘어). 마음에 드는 알파벳을 알려 주세요.</p>
<section class="logos"><figure><img src="/logo-a.svg" alt="로고 A" height="40"><figcaption><b>A.</b> 굵은 글자, 자간을 약간 넓게</figcaption></figure>
<figure><img src="/logo-b.svg" alt="로고 B" height="70"><figcaption><b>B.</b> 두 줄로 쌓기</figcaption></figure>
<figure><img src="/logo-c.svg" alt="로고 C" height="40"><figcaption><b>C.</b> 얇은 글자, 자간을 넓게</figcaption></figure></section></main></body></html>
